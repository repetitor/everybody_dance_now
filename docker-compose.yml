services:
  app:
    build:
      context: ./docker/php/${PHP_VERSION:-8.3}
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - laravel
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=${DB_HOST:-database}

  webserver:
    image: nginx:${NGINX_VERSION:-1.25}-alpine
    ports:
      - "80:80"    # Только HTTP
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
#      - ./public:/var/www/html/public
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - laravel

  database:
#    image: mysql:${MYSQL_VERSION:-8.0}
#    command: sh -c "apt-get update || apk update && (apt-get install -y procps || apk add --no-cache procps) && docker-entrypoint.sh mysqld"
#    environment:
#      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
#      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
##    volumes:
##      - mysql_data:/var/lib/mysql
##      - ./docker/mysql/${MYSQL_VERSION:-8.0}/my.cnf:/etc/mysql/conf.d/custom.cnf
#    volumes: []  # Удалите том mysql_data
    image: mariadb:10.11  # Более стабильная версия
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: laravel
    ports:
      - "3306:3306"
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
