services:
  app:
    build:
      context: ./docker/php/${PHP_VERSION:-8.3}
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - laravel
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=${DB_HOST:-database}

  webserver:
    image: nginx:${NGINX_VERSION:-1.25}-alpine
    ports:
      - "80:80"    # Только HTTP
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
#      - ./public:/var/www/html/public
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - laravel

  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/${MYSQL_VERSION:-8.0}/my.cnf:/etc/mysql/conf.d/custom.cnf
    ports:
      - "3306:3306"
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge